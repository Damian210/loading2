<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Now</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px 0;
      box-sizing: border-box;
    }

    .container {
      background: #1c1c1c;
      padding: 25px 20px;
      border-radius: 12px;
      width: 100%;
      max-width: 350px; 
      box-sizing: border-box;
      text-align: center;
      position: relative;
    }

    /* Dynamic Image & Video Player Wrapper */
    .media-container {
      position: relative;
      width: fit-content;
      max-width: 100%;
      margin: 0 auto 15px auto;
      border-radius: 8px;
      overflow: hidden;
      display: none;
      background: transparent;
      cursor: pointer;
    }

    /* Dynamic Image Styles */
    .preview-img {
      display: block;
      max-width: 100%;
      height: auto;
      max-height: 350px;
      border-radius: 8px;
      margin: 0 auto;
    }

    /* Dummy Play Button Styles */
    .play-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 55px;
      height: 55px;
      background: rgba(0, 0, 0, 0.65);
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      transition: all 0.2s ease-in-out;
      pointer-events: none;
    }

    /* Play Icon (Triangle) */
    .play-btn::after {
      content: "";
      display: block;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 10px 0 10px 18px;
      border-color: transparent transparent transparent #ffffff;
      margin-left: 4px;
    }

    .media-container:hover .play-btn {
      background: rgba(255, 0, 0, 0.85);
      border-color: #ffffff;
      transform: translate(-50%, -50%) scale(1.1);
    }

    h3 {
      font-weight: 400;
      margin-top: 0;
      margin-bottom: 20px;
      line-height: 1.5;
      font-size: 0.95rem;
    }

    .btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      border-radius: 8px;
      margin-bottom: 20px;
      text-decoration: none;
      width: 100%;
      box-sizing: border-box;
      gap: 10px;
      font-weight: bold;
      border: none;
    }

    .unlock-btn { background: #dc3545; color: white; cursor: pointer; }
    .unlock-btn:hover { background: #bd2130; }
    .completed { background: #333 !important; color: #777 !important; cursor: default; }
    
    .go-btn { background: #2a2a2a; color: #555; pointer-events: none; }
    .active { background: #007bff !important; color: white !important; pointer-events: auto; }

    .btn span:nth-child(2) {
      flex-grow: 1;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 0.85rem;
    }

    .icon { flex-shrink: 0; width: 20px; display: flex; justify-content: center; }

    /* Progress UI */
    .status-text { font-size: 0.85rem; margin-bottom: 10px; font-weight: bold; }
    .progress-bg { 
      background: #333; 
      height: 6px; 
      border-radius: 10px; 
      width: 100%; 
      margin-bottom: 25px; 
      overflow: hidden; 
    }
    .progress-fill { 
      background: #008000; 
      height: 100%; 
      width: 0%; 
      transition: width 0.7s ease-in-out; 
    }

    /* Modal / Popup Styles */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 15px;
      box-sizing: border-box;
    }

    .modal-box {
      background: #252525;
      padding: 20px;
      border-radius: 12px;
      max-width: 300px;
      width: 100%;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.5);
      border: 1px solid #333;
    }

    .modal-box p {
      margin: 0 0 15px 0;
      font-size: 0.9rem;
      line-height: 1.4;
      color: #ddd;
    }

    .modal-close-btn {
      background: #007bff;
      color: white;
      border: none;
      padding: 8px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Dynamic Image with Play Button Wrapper -->
    <div id="mediaBox" class="media-container">
      <img id="dynamicImg" class="preview-img" alt="Video Thumbnail" />
      <div class="play-btn"></div>
    </div>

    <h3>Your Link is Ready<br>
    <span style="color: #aaa; font-size: 0.8rem;">Complete the action and unlock the video</span></h3>

    <div id="unlockBtn" class="btn unlock-btn">
      <span class="icon">🔗</span>
      <span id="btnText">Click and Back</span>
      <span id="checkIcon" class="icon">❯</span>
    </div>

    <div class="status-text">Steps Completed <span id="stepCount">0</span>/ 1</div>
    <div class="progress-bg">
      <div id="progressFill" class="progress-fill"></div>
    </div>

    <a href="#" id="goBtn" class="btn go-btn">
      <span class="icon">🔗</span>
      <span>Watch</span>
      <span class="icon">❯</span>
    </a>
  </div>

  <!-- Custom Popup Modal -->
  <div id="noticeModal" class="modal-overlay">
    <div class="modal-box">
      <p id="modalText">🔒 Please complete the step below to unlock and watch the full video!</p>
      <button id="modalCloseBtn" class="modal-close-btn">OK</button>
    </div>
  </div>

<script>
(function(_w, _d) {
    // --- CONFIGURATION ---
    const _AD = "https://otieu.com/4/10203280";
    const _TXT_1 = "Click and go back";
    const _TXT_2 = "Please wait 4 seconds before going back!";
    const _TXT_WAIT = "Checking... ⏳";
    // ---------------------

    function _getParam(p) {
        var params = new URLSearchParams(_w.location.search);
        return params.get(p);
    }

    // Load params from URL or SessionStorage (Fixes the refresh issue)
    var _l = _getParam('link') || sessionStorage.getItem('temp_link');
    var _img = _getParam('image') || sessionStorage.getItem('temp_image');

    // Save values to sessionStorage for refresh persistent storage
    if (_getParam('link')) sessionStorage.setItem('temp_link', _getParam('link'));
    if (_getParam('image')) sessionStorage.setItem('temp_image', _getParam('image'));

    var modal = _d.getElementById("noticeModal");
    var modalCloseBtn = _d.getElementById("modalCloseBtn");

    // Display dynamic image
    if (_img && (_img.startsWith("http://") || _img.startsWith("https://"))) {
        var imgEl = _d.getElementById("dynamicImg");
        var mediaBox = _d.getElementById("mediaBox");
        imgEl.src = decodeURIComponent(_img);
        mediaBox.style.display = "block";

        // Handle click event
        mediaBox.addEventListener("click", function() {
            if (localStorage.getItem(_k) === "1") {
                _w.location.href = _l;
            } else {
                modal.style.display = "flex";
            }
        });
    }

    modalCloseBtn.addEventListener("click", function() {
        modal.style.display = "none";
    });

    // Check target link
    if (!_l || !(_l.startsWith("http://") || _l.startsWith("https://"))) {
        _d.querySelector('.container').innerHTML = "<h3>Invalid or missing link</h3>";
        throw "Err";
    }

    try {
        _l = decodeURIComponent(_l);
    } catch(e) {}

    // Clean address bar while retaining data in sessionStorage
    if (_w.history && _w.history.replaceState) {
        _w.history.replaceState({}, _d.title, _w.location.pathname);
    }

    var _e = {
        u: _d.getElementById("unlockBtn"),
        t: _d.getElementById("btnText"),
        g: _d.getElementById("goBtn"),
        p: _d.getElementById("progressFill"),
        s: _d.getElementById("stepCount"),
        c: _d.getElementById("checkIcon")
    };

    var _k = "unlocked_" + btoa(_l), _ts = 0;

    function _ok() {
        _e.u.classList.add("completed");
        _e.u.style.pointerEvents = "none";
        _e.t.innerText = _TXT_1;
        _e.c.innerHTML = "✔";
        _e.c.style.color = "#00c853";
        _e.s.innerText = "1";
        _e.p.style.width = "100%";
        _e.g.classList.add("active");
        _e.g.href = _l;
        localStorage.setItem(_k, "1");
    }

    if (localStorage.getItem(_k) === "1") _ok();

    _e.u.addEventListener("click", function() {
        if (localStorage.getItem(_k) === "1") return;
        _ts = Date.now();
        _w.open(_AD, "_blank");
        _e.t.innerText = _TXT_WAIT;
    });

    _w.addEventListener("focus", function() {
        if (_ts === 0 || localStorage.getItem(_k) === "1") return;
        if ((Date.now() - _ts) / 1000 >= 3) {
            _ok();
        } else {
            _e.t.innerText = _TXT_1;
            _ts = 0;
            alert(_TXT_2);
        }
    });
})(window, document);
</script>
</body>
</html>
