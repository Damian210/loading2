<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Now</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 0 15px;
    }

    .container {
      background: #1c1c1c;
      padding: 30px 20px;
      border-radius: 12px;
      width: 100%;
      max-width: 350px; 
      box-sizing: border-box;
      text-align: center;
    }

    h3 {
      font-weight: 400;
      margin-bottom: 20px;
      line-height: 1.5;
      font-size: 0.95rem;
    }

    .btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      border-radius: 8px;
      margin-bottom: 20px;
      text-decoration: none;
      width: 100%;
      box-sizing: border-box;
      gap: 10px;
      font-weight: bold;
      border: none;
    }

    .unlock-btn { background: #007bff; color: white; cursor: pointer; }
    .completed { background: #333 !important; color: #777 !important; cursor: default; }
    
    .go-btn { background: #2a2a2a; color: #555; pointer-events: none; }
    .active { background: #007bff !important; color: white !important; pointer-events: auto; }

    .btn span:nth-child(2) {
      flex-grow: 1;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 0.85rem;
    }

    .icon { flex-shrink: 0; width: 20px; display: flex; justify-content: center; }

    /* Progress UI */
    .status-text { font-size: 0.85rem; margin-bottom: 10px; font-weight: bold; }
    .progress-bg { 
      background: #333; 
      height: 6px; 
      border-radius: 10px; 
      width: 100%; 
      margin-bottom: 25px; 
      overflow: hidden; 
    }
    .progress-fill { 
      background: #008000; 
      height: 100%; 
      width: 0%; 
      transition: width 0.7s ease-in-out; 
    }
  </style>
</head>
<body>

  <div class="container">
    <h3>Click below and complete the action to unlock your link!<br>
    <span style="color: #aaa; font-size: 0.8rem;">Complete the actions and unlock the link</span></h3>

    <div id="unlockBtn" class="btn unlock-btn">
      <span class="icon">🔗</span>
      <span id="btnText">Click and go back</span>
      <span id="checkIcon" class="icon">❯</span>
    </div>

    <div class="status-text">Steps Completed <span id="stepCount">0</span>/ 1</div>
    <div class="progress-bg">
      <div id="progressFill" class="progress-fill"></div>
    </div>

    <a href="#" id="goBtn" class="btn go-btn">
      <span class="icon">🔗</span>
      <span>Proceed / Visit Link</span>
      <span class="icon">❯</span>
    </a>
  </div>

<script>
(function(_w, _d) {
    // --- CONFIGURATION ---
    const _AD = "https://otieu.com/4/10203280";
    const _TXT_1 = "Click and go back";
    const _TXT_2 = "Please wait 4 seconds before going back!";
    const _TXT_WAIT = "Checking... ⏳";
    // ---------------------

    function _gU() {
        // location.search වෙනුවට location.href ගන්නවා (#, %, & සියල්ලම කැපෙන්නේ නැතුව ආරක්ෂිතව එන්න)
        var fullUrl = _w.location.href;
        var index = fullUrl.indexOf("link=");
        if (index === -1) return null;
        var r = fullUrl.substring(index + 5);
        try { 
            return decodeURIComponent(r); 
        } catch (e) { 
            return r; 
        }
    }

    var _l = _gU();
    
    // URL එක valid ද කියලා check කරනවා
    if (!_l || !(_l.startsWith("http://") || _l.startsWith("https://"))) {
        _d.querySelector('.container').innerHTML = "<h3>Invalid or missing link</h3>";
        throw "Err";
    }

    // Link එක read කරගත් පසු, Address bar එකෙන් ?link=... කොටස සඟවා URL එක clean කරයි
    if (_w.history && _w.history.replaceState) {
        _w.history.replaceState({}, _d.title, _w.location.pathname);
    }

    var _e = {
        u: _d.getElementById("unlockBtn"),
        t: _d.getElementById("btnText"),
        g: _d.getElementById("goBtn"),
        p: _d.getElementById("progressFill"),
        s: _d.getElementById("stepCount"),
        c: _d.getElementById("checkIcon")
    };

    var _k = "unlocked_" + btoa(_l), _ts = 0;

    function _ok() {
        _e.u.classList.add("completed");
        _e.u.style.pointerEvents = "none";
        _e.t.innerText = _TXT_1;
        _e.c.innerHTML = "✔";
        _e.c.style.color = "#00c853";
        _e.s.innerText = "1";
        _e.p.style.width = "100%";
        _e.g.classList.add("active");
        _e.g.href = _l;
        localStorage.setItem(_k, "1");
    }

    if (localStorage.getItem(_k) === "1") _ok();

    _e.u.addEventListener("click", function() {
        if (localStorage.getItem(_k) === "1") return;
        _ts = Date.now();
        _w.open(_AD, "_blank");
        _e.t.innerText = _TXT_WAIT;
    });

    _w.addEventListener("focus", function() {
        if (_ts === 0 || localStorage.getItem(_k) === "1") return;
        if ((Date.now() - _ts) / 1000 >= 3) {
            _ok();
        } else {
            _e.t.innerText = _TXT_1;
            _ts = 0;
            alert(_TXT_2);
        }
    });
})(window, document);
</script>
</body>
</html>
