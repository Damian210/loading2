<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link Generator & Copier</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }

    .container {
      background: #1c1c1c;
      padding: 25px 20px;
      border-radius: 12px;
      width: 100%;
      max-width: 450px;
      box-sizing: border-box;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    h3 {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 1.1rem;
      color: #007bff;
    }

    label {
      display: block;
      text-align: left;
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 5px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 15px;
    }

    textarea {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #2a2a2a;
      color: #fff;
      box-sizing: border-box;
      font-size: 0.9rem;
      outline: none;
      resize: vertical;
      height: 80px;
    }

    textarea:focus {
      border-color: #007bff;
    }

    .btn {
      background: #007bff;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      width: 100%;
      font-weight: bold;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #0056b3;
    }

    .paste-btn {
      background: #28a745;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }

    .paste-btn:hover {
      background: #218838;
    }

    .status {
      margin-top: 12px;
      font-size: 0.85rem;
      color: #00c853;
      font-weight: bold;
      height: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h3>Open-Link Creator</h3>
    
    <label for="rawInput">1. Paste Original Link Here:</label>
    <div class="input-group">
      <textarea id="rawInput" placeholder="" oninput="generateLink()"></textarea>
      <button class="paste-btn" onclick="pasteClipboard()">Paste Link</button>
    </div>

    <label for="finalOutput">2. Final Unlocker Link (Generated):</label>
    <textarea id="finalOutput" readonly placeholder="" style="margin-bottom: 15px;"></textarea>

    <button class="btn" onclick="copyFinalLink()">Copy Full Link</button>
    <div id="status" class="status"></div>
  </div>

<script>
  const BASE_URL = "https://open-link.online/hunlock?link=";

  function generateLink() {
    const rawValue = document.getElementById("rawInput").value.trim();
    const outputBox = document.getElementById("finalOutput");
    const statusBox = document.getElementById("status");

    statusBox.innerText = "";

    if (rawValue !== "") {
      outputBox.value = BASE_URL + rawValue;
    } else {
      outputBox.value = "";
    }
  }

  async function pasteClipboard() {
    const statusBox = document.getElementById("status");
    try {
      const text = await navigator.clipboard.readText();
      document.getElementById("rawInput").value = text;
      generateLink();
      statusBox.style.color = "#00c853";
      statusBox.innerText = "Pasted successfully! ✔";
    } catch (err) {
      statusBox.style.color = "#ff5252";
      statusBox.innerText = "Please allow Clipboard permission!";
    }
  }

  function copyFinalLink() {
    const outputBox = document.getElementById("finalOutput");
    const statusBox = document.getElementById("status");

    if (!outputBox.value) {
      statusBox.style.color = "#ff5252";
      statusBox.innerText = "Please paste a link first!";
      return;
    }

    outputBox.select();
    outputBox.setSelectionRange(0, 99999);
    navigator.clipboard.writeText(outputBox.value).then(() => {
      statusBox.style.color = "#00c853";
      statusBox.innerText = "Full link copied to clipboard! ✔";
    }).catch(() => {
      document.execCommand("copy");
      statusBox.style.color = "#00c853";
      statusBox.innerText = "Full link copied to clipboard! ✔";
    });
  }
</script>
</body>
</html>
