<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Now</title>
  <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "w5k6fmgoum");
  </script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 0 15px;
    }

    .container {
      background: #1c1c1c;
      padding: 30px 20px;
      border-radius: 12px;
      width: 100%;
      max-width: 350px; 
      box-sizing: border-box;
      text-align: center;
    }

    h3 {
      font-weight: 400;
      margin-bottom: 20px;
      line-height: 1.5;
      font-size: 0.95rem;
    }

    .btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      border-radius: 8px;
      margin-bottom: 20px;
      text-decoration: none;
      width: 100%;
      box-sizing: border-box;
      gap: 10px;
      font-weight: bold;
      border: none;
    }

    .unlock-btn { background: #007bff; color: white; cursor: pointer; }
    .completed { background: #333 !important; color: #777 !important; cursor: default; }
    
    .go-btn { background: #2a2a2a; color: #555; pointer-events: none; }
    .active { background: #007bff !important; color: white !important; pointer-events: auto; }

    .btn span:nth-child(2) {
      flex-grow: 1;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 0.85rem;
    }

    .icon { flex-shrink: 0; width: 20px; display: flex; justify-content: center; }

    /* Progress UI */
    .status-text { font-size: 0.85rem; margin-bottom: 10px; font-weight: bold; }
    .progress-bg { 
      background: #333; 
      height: 6px; 
      border-radius: 10px; 
      width: 100%; 
      margin-bottom: 25px; 
      overflow: hidden; 
    }
    .progress-fill { 
      background: #008000; 
      height: 100%; 
      width: 0%; 
      transition: width 2.1s ease-in-out; 
    }
  </style>
</head>
<body>

  <div class="container">
    <h3>Your Link is Ready.<br>
    <span style="color: #aaa; font-size: 0.8rem;">Complete the actions and unlock the link</span></h3>

    <div id="unlockBtn" class="btn unlock-btn">
      <span class="icon">🔗</span>
      <span>Click and Back</span>
      <span id="checkIcon" class="icon">❯</span>
    </div>

    <div class="status-text">Steps Completed <span id="stepCount">0</span>/ 1</div>
    <div class="progress-bg">
      <div id="progressFill" class="progress-fill"></div>
    </div>

    <a href="#" id="goBtn" class="btn go-btn">
      <span class="icon">🔗</span>
      <span>Join</span>
      <span class="icon">❯</span>
    </a>
  </div>

  <script>
  (function(window, document) {
    // --- CONFIGURATION ---
    const TARGET_AD = "https://omg10.com/4/10423235"; 
    // ---------------------

    function getLink() {
      var query = window.location.search;
      var match = query.match(/[?&]link=/);
      if (!match) return null;
      var start = match.index + match[0].length;
      var rawLink = query.substring(start);
      try { return decodeURIComponent(rawLink); } catch (e) { return rawLink; }
    }

    var link = getLink();
    
    // Changed validation: Now accepts any link as long as it's not empty
    var isValid = link && link.trim() !== ""; 

    if (!isValid) {
      document.querySelector('.container').innerHTML = "<h3>Invalid or missing link</h3>";
      throw new Error("Invalid");
    }

    var unlockBtn = document.getElementById("unlockBtn"); 
    var goBtn = document.getElementById("goBtn"); 
    var progressFill = document.getElementById("progressFill"); 
    var stepCount = document.getElementById("stepCount"); 
    var checkIcon = document.getElementById("checkIcon"); 
    var storageKey = "unlocked_" + btoa(link);

    function unlock() {
      unlockBtn.classList.add("completed");
      checkIcon.innerHTML = "✔";
      checkIcon.style.color = "#00c853";
      stepCount.innerText = "1";
      progressFill.style.width = "100%";
      goBtn.classList.add("active");
      goBtn.href = link;
    }

    if (localStorage.getItem(storageKey) === "true") {
      unlock();
    }

    unlockBtn.addEventListener("click", function() {
      if (localStorage.getItem(storageKey) === "true") return;
      window.open(TARGET_AD, "_blank");
      window.focus();
      localStorage.setItem(storageKey, "true");
      unlock();
    });

  })(window, document);
  </script>
</body>
</html>
